# Cargo workspace: все Rust-пакеты репозитория собираются вместе,
# с общим каталогом сборки target/ и общим Cargo.lock.
[workspace]
resolver = "3"
members = ["src-tauri", "crates/item-parser", "crates/game-window", "crates/browser-bridge", "crates/discord-presence", "crates/craft-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Профили сборки задаются только в корне workspace.
# Подробнее: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
