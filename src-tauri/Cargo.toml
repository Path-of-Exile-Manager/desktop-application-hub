[package]
name = "poe-manager"
description = "poe-manager — инструменты для Path of Exile 1"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poe_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
item-parser = { path = "../crates/item-parser" }
game-window = { path = "../crates/game-window" }
browser-bridge = { path = "../crates/browser-bridge" }
discord-presence = { path = "../crates/discord-presence" }
craft-engine = { path = "../crates/craft-engine" }
pob-parser = { path = "../crates/pob-parser" }
# HTTP-клиент для связи с сервером (BFF): маленький, синхронный — работает в своём потоке.
# gzip включён явно: прайс лиги — ~13 МБ JSON, сжатым ~0,7 МБ (Accept-Encoding ставит сам ureq).
ureq = { version = "3", features = ["json", "gzip"] }
# Чтение .env / .env.local в отладочной сборке (API_URL).
dotenvy = "0.15"
# Id устройства (UUID v7, заголовок X-Device-Id).
uuid = { version = "1.29.1", features = ["v7", "serde"] }
# TypeScript-типы для интерфейса из Rust-структур: `pnpm gen:types` → ui/src/generated.
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
# Проверка файлов набора данных и иконок: они адресуются по sha256 содержимого.
sha2 = "0.10"
# Захват предмета: горячая клавиша (только пока игра в фокусе), Ctrl+Alt+C через SendInput, буфер обмена;
# фокус обратно игре после оверлея (SetForegroundWindow).
tauri-plugin-global-shortcut = "2"
arboard = { version = "3", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Аккаунт: refresh-токен — в диспетчере учётных данных Windows, вход — в системном браузере.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
# Данные пользователя (закладки, история, пины, watchlist) — user.db; SQLite собирается вместе с приложением.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Ожидание ответа расширения с таймаутом (мост — на tokio, как и рантайм Tauri).
tokio = { version = "1", features = ["time"] }
