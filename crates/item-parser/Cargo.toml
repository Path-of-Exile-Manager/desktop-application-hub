[package]
name = "item-parser"
description = "Разбор текста предмета PoE1, скопированного из игры (Ctrl+C / Ctrl+Alt+C)"
version.workspace = true
edition.workspace = true

# Никаких зависимостей от Tauri и Windows: crate должен собираться и в WASM (для расширения).
[dependencies]
serde = { version = "1", features = ["derive"] }
# TypeScript-типы результата разбора для интерфейса (`pnpm gen:types`).
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
