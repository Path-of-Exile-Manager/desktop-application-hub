[package]
name = "pob-parser"
description = "Разбор кода экспорта Path of Building (PoE1): предметы, наборы, камни, деревья"
version.workspace = true
edition.workspace = true

# Чистая логика без Tauri, сети и справочника: код PoB → модель сборки.
# Часть разбора перенесена из PoB Trade Finder (MIT) — см. LICENSE-PoB-Trade-Finder.
[dependencies]
serde = { version = "1", features = ["derive"] }
# TypeScript-типы модели для интерфейса (`pnpm gen:types`).
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
# Код PoB — base64url поверх zlib.
base64 = "0.23"
flate2 = "1"
# XML документа PoB — настоящим парсером, а не регулярками.
roxmltree = "0.21"
regex = "1"

[dev-dependencies]
# examples/dump.rs печатает разобранную сборку JSON-ом.
serde_json = "1"
