<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Виджет оверлея A — подробный</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 440px; box-sizing: border-box; background: rgba(19,15,18,0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid #363134; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4); font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; color: #f1edef; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 10px; border-bottom: 1px solid #363134; background: rgba(33,29,31,0.9)">
    <svg aria-hidden="true" width="12" height="16" viewBox="0 0 12 16" fill="#847e82"><circle cx="3" cy="3" r="1.5"></circle><circle cx="9" cy="3" r="1.5"></circle><circle cx="3" cy="8" r="1.5"></circle><circle cx="9" cy="8" r="1.5"></circle><circle cx="3" cy="13" r="1.5"></circle><circle cx="9" cy="13" r="1.5"></circle></svg>
    <span style="font-size: 13px; color: #a8a3a6; flex: 1">Price check</span>
    <button aria-label="Закрепить" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 6px; color: #a8a3a6; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></button>
    <button aria-label="Закрыть" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 6px; color: #a8a3a6; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
  </div>
  <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 5px">
    <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; line-height: 18px; padding: 0 6px; border: 1px solid #FFFF77; border-radius: 4px; color: #FFFF77">RARE</span><span style="font-size: 13px; color: #a8a3a6">Body Armour</span></div>
    <span style="font-size: 18px; line-height: 24px; font-weight: 600; color: #FFFF77">Doom Shell</span>
    <span style="font-size: 13px; color: #cdc9cb">Vaal Regalia · iLvl <span style="font-family: 'JetBrains Mono', monospace">84</span> · Q <span style="font-family: 'JetBrains Mono', monospace">+20%</span> · ES <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #f1edef">512</span> · <span style="color: #f1edef">6L</span> <span style="font-family: 'JetBrains Mono', monospace; color: #a8a3a6">BBBBB-G</span></span>
  </div>
  <div style="border-top: 1px solid #363134; padding: 12px 16px; display: flex; flex-direction: column; gap: 7px">
    <sc-for list="{{mods}}" as="m" hint-placeholder-count="6">
      <div style="display: flex; align-items: flex-start; gap: 10px">
        <span title="{{m.full}}" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; background: {{m.abg}}; border: 1px solid {{m.ab}}; border-radius: {{m.ar}}">{{m.a}}</span>
        <span style="flex: 1; min-width: 0; font-size: 14px; line-height: 20px; color: {{m.color}}"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 600">{{m.val}}</span><span style="font-family: 'JetBrains Mono', monospace; color: #a8a3a6">{{m.range}}</span>{{m.text}}</span>
        <span style="flex: none; min-width: 26px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; line-height: 18px; padding: 0 4px; border: 1px solid {{m.tb}}; color: {{m.tc}}; border-radius: 4px">{{m.tier}}</span>
      </div>
    </sc-for>
  </div>
  <div style="border-top: 1px solid #363134; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; line-height: 20px; padding: 0 7px; border: 1px solid #F3413C; background: rgba(243,65,60,0.12); border-radius: 4px; color: #F3413C">◆ CORRUPTED</span>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
      <div style="display: flex; align-items: center; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600">~120</span><svg role="img" aria-label="Chaos Orb" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="none" stroke="#AA9E82" stroke-width="1.5"></circle><text x="9" y="12.5" text-anchor="middle" font-size="10" font-weight="700" fill="#AA9E82" font-family="sans-serif">c</text></svg><span style="font-size: 14px; color: #cdc9cb">chaos</span></div>
      <span style="font-size: 13px; color: #a8a3a6"><span style="font-family: 'JetBrains Mono', monospace">≈ 0.6 div</span> · 23 похожих</span>
    </div>
  </div>
  <div style="border-top: 1px solid #363134; padding: 10px 12px; display: flex; gap: 8px; background: rgba(26,22,24,0.9)">
    <button style="flex: 1; height: 32px; border-radius: 6px; border: 1px solid #4b4649; background: #211d1f; color: #f1edef; font: 500 13px Inter, sans-serif">Подробнее в окне</button>
    <button style="flex: 1; height: 32px; border-radius: 6px; border: none; background: transparent; color: #ff72b7; font: 500 13px Inter, sans-serif">В ассистент крафта</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (pre, val, range, text, tier, crafted) => ({ a: pre ? 'P' : 'S', full: pre ? 'Prefix' : 'Suffix', abg: pre ? '#363134' : 'transparent', ab: pre ? '#363134' : '#a8a3a6', ar: pre ? '4px' : '10px', val, range, text, tier,
      color: crafted ? '#B4B4FF' : '#f1edef', tb: tier === 'T1' ? '#ff72b7' : '#363134', tc: tier === 'T1' ? '#ff72b7' : (tier === '—' ? '#847e82' : '#a8a3a6') });
    return { mods: [
      m(true, '+105', '(100–109)', ' to maximum Energy Shield', 'T1'),
      m(true, '+87', '(80–89)', ' to maximum Life', 'T2'),
      m(true, '+28', '(27–32)', '% increased Energy Shield', 'T3'),
      m(false, '+38', '(36–41)', '% to Fire Resistance', 'T3'),
      m(false, '+46', '(46–48)', '% to Lightning Resistance', 'T1'),
      m(false, '+15', '(15–16)', '% to Cold Resistance · crafted', '—', true)
    ] };
  }
}
</script>
</body>
</html>
