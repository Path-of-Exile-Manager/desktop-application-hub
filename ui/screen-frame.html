<!doctype html>
<!--
  Только для разработки: стенд для скриншотов (scripts/screenshots.ps1).
  Headless Chrome раскладывает страницу в окне меньше заданного и растягивает при съёмке,
  поэтому приложение открывается в iframe точного размера: /screen-frame.html?w=1440&h=900&q=module=craft
  В сборку не попадает: Vite собирает только index.html.
-->
<html lang="ru">
  <body style="margin: 0">
    <iframe id="frame" title="poe-manager" style="display: block; border: 0"></iframe>
    <script>
      const p = new URLSearchParams(location.search);
      const frame = document.getElementById("frame");
      frame.width = p.get("w") ?? "1440";
      frame.height = p.get("h") ?? "900";
      frame.src = "/?" + (p.get("q") ?? "");
    </script>
  </body>
</html>
